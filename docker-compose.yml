# Brings up mongo, kafka and the backend together.
# For local development you can also start only mongo and kafka, and run the app from the IDE.
services:

  mongo:
    image: mongo:7
    container_name: order_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    # official apache image, runs in kraft mode so no zookeeper is needed
    image: apache/kafka:4.2.1
    container_name: order_kafka
    ports:
      # host port, use this one when the app runs outside docker
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # same container works as broker and controller
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # INTERNAL is used by the containers, EXTERNAL by anything running on the host
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # single broker setup, so everything stays at one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  backend:
    build: ./order_backend
    container_name: order_backend
    ports:
      - "8080:8080"
    # mail and jwt secrets are picked from the .env file, copy .env.example to get started
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongo
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - mongo
      - kafka

volumes:
  mongo_data:
  kafka_data:
