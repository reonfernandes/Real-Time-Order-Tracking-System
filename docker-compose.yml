# Brings up mongo, kafka and the backend together.
# For local development you can also start only mongo and kafka, and run the app from the IDE.
services:

  mongo:
    image: mongo:7
    container_name: order_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: bitnami/kafka:3.7
    container_name: order_kafka
    ports:
      # host port, use this one when the app runs outside docker
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      # INTERNAL is used by the containers, EXTERNAL by anything running on the host
      - KAFKA_CFG_LISTENERS=INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  backend:
    build: ./order_backend
    container_name: order_backend
    ports:
      - "8080:8080"
    # mail and jwt secrets are picked from the .env file, copy .env.example to get started
    env_file:
      - .env
    environment:
      - MONGO_HOST=mongo
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - mongo
      - kafka

volumes:
  mongo_data:
  kafka_data:
