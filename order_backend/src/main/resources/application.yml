spring:
    application:
        name: order_backend
    config:
        import: optional:file:.env
    data:
        mongodb:
            # defaults are for running locally, docker passes the real host through env
            host: ${MONGO_HOST:localhost}
            port: ${MONGO_PORT:27017}
            database: ${MONGO_DATABASE:order_tracking}
            auto-index-creation: true
    kafka:
        producer:
            bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
            acks: all
            retries: 3
        consumer:
            bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
            group-id: grp_orders
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            auto-offset-reset: earliest
            # kept false so the offset moves only after the listener is done,
            # otherwise a crash in between silently drops the event
            enable-auto-commit: false
            properties:
                spring:
                    json:
                        trusted:
                            packages: "*"

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        protocol: smtp
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true

email:
    sender: ${EMAIL_SENDER}

app:
    cors:
        # comma separated list, override in env when the frontend is deployed somewhere else
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    cookie:
        # a browser throws away a Secure cookie on a plain http page, and localhost is the
        # only http origin it makes an exception for. Set false for an http deployment.
        secure: ${COOKIE_SECURE:true}
        # Strict works while the api and the ui share a host, use None (with secure) if not
        same-site: ${COOKIE_SAME_SITE:Strict}

jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${EXPIRATION_TIME}
